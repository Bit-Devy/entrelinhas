[package]
name = "entrelinhas"
version = "0.3.0"
description = "Um espaço tranquilo para escrever"
authors = ["Bit-Devy"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "entrelinhas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
tauri-plugin-window-state = "2.5.0"

[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
